name: Build Android APK (Local en Linux)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 4. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar dependencias del proyecto
        run: pnpm install --frozen-lockfile

      - name: 6. Instalar EAS CLI
        run: npm install -g eas-cli

      - name: 7. Validar salud del proyecto con Expo Doctor
        continue-on-error: true
        run: pnpm dlx expo-doctor

      - name: 8. Compilar APK en servidor Linux
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output=./mercedes-mobile-preview.apk

      - name: 9. Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: mercedes-mobile-apk
          path: ./mercedes-mobile-preview.apk
          retention-days: 7
